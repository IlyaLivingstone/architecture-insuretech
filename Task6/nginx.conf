http {
    # Rate limiting: не более 10 запросов в минуту с одного IP.
    # Ключ — $binary_remote_addr (IP клиента), размер зоны — 10 МБ.
    limit_req_zone $binary_remote_addr zone=partner_api:10m rate=10r/m;

    # Настройка upstream для балансировки нагрузки
    upstream backend_servers {
        server backend1.example.com;
        server backend2.example.com;
        server backend3.example.com;
    }

    server {
        listen 80;

        location / {
            # Применяем лимит к запросам к бэкенду.
            # burst=0 — без послабления на всплеск: запросы сверх лимита
            # отклоняются сразу, то есть строго не более 10 в минуту.
            limit_req zone=partner_api burst=0;

            # При превышении лимита возвращаем HTTP 429 Too Many Requests.
            limit_req_status 429;

            proxy_pass http://backend_servers;
        }
    }
}
