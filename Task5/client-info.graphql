# GraphQL-схема сервиса client-info
#
# Заменяет REST API из Swagger-контракта:
#   GET /clients/{id}            -> Client
#   GET /clients/{id}/documents  -> [Document]
#   GET /clients/{id}/relatives  -> [Relative]
#
# Почему схема выглядит именно так. Карточка клиента — это ~500 атрибутов, и отдавать
# её целиком одним ресурсом нельзя: ответ станет слишком тяжёлым для веб-приложения.
# Поэтому в REST данные порезаны на отдельные ресурсы, и потребитель вынужден ходить
# за каждым куском отдельно. Здесь вложенные данные объявлены полями самой карточки:
# потребитель одним запросом берёт только то, что нужно его сценарию продажи
# или обслуживания страховки.

schema {
  query: Query
}

# Дата в формате ISO 8601 (YYYY-MM-DD).
# В Swagger эти поля объявлены как string, но фактически это даты, поэтому
# формат зафиксирован отдельным скалярным типом, а не строкой.
scalar Date

type Query {
  # Точка входа вместо всех трёх REST-методов сразу.
  # Если клиента с таким id нет — возвращается null.
  client(id: ID!): Client
}

type Client {
  # id присутствует всегда; остальные поля необязательные — в Swagger они
  # не помечены обязательными, и при таком объёме карточки часть данных
  # заполнена не у каждого клиента.
  id: ID!

  name: String
  age: Int

  # То же, что GET /clients/{id}/documents.
  # Аргумент type сужает выборку: можно взять, например, только паспорта,
  # не вытягивая весь список документов.
  documents(type: String): [Document]

  # То же, что GET /clients/{id}/relatives.
  relatives(relationType: String): [Relative]
}

type Document {
  id: ID!

  # Вид документа (паспорт, водительское удостоверение и т. д.).
  # В Swagger это string без перечисления допустимых значений, поэтому и здесь String;
  # если набор видов зафиксируют, поле можно сузить до enum.
  type: String
  number: String
  issueDate: Date
  expiryDate: Date
}

type Relative {
  id: ID!

  # Степень родства: по той же причине, что и type у Document, оставлена строкой.
  relationType: String
  name: String
  age: Int
}

# Если потребителю понадобится получать несколько карточек за один вызов,
# в Query можно добавить пакетный запрос по списку идентификаторов — сама
# структура типов для этого уже готова.
#
# Пример: в REST за такой результат нужно три обращения —
#   GET /clients/123
#   GET /clients/123/documents
#   GET /clients/123/relatives
# а здесь хватает одного, и лишние поля не передаются:
#
#   query {
#     client(id: "123") {
#       name
#       documents { type number }
#       relatives { relationType name }
#     }
#   }
